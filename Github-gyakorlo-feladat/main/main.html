<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IKT Projekt // Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-color: #00ffcc;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2, h3 {
            font-family: 'Share Tech Mono', monospace;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.05);
        }

        .terminal-header {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin: 10px 0;
        }

        a {
            color: var(--accent-color);
            text-decoration: none;
            transition: 0.2s;
            font-family: 'Share Tech Mono', monospace;
        }

        a:hover {
            color: #fff;
            text-shadow: 0 0 8px var(--accent-color);
        }

        .sysadmin-img {
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            border: 1px solid var(--accent-color);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            margin-top: 15px;
        }

        #js-clock {
            font-family: 'Share Tech Mono', monospace;
            background: rgba(0, 255, 204, 0.1);
            padding: 8px 12px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent-color);
            border: 1px dashed var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="terminal-header">> SYSTEM_ROOT // MAIN.HTML // STATUS: ONLINE</div>
        
        
        <div id="js-clock">Rendszeridő betöltése...</div>

        <h1>Üdvözöljük a weboldalunkon!</h1>

        <h2>Tanulnivalók:</h2>
        <ul>
            <li>> <a href="../csapat_tagok/matyi/osi.html">OSI modell felépítése</a> (Csapattárs oldala)</li>
            <li>> <a href="../csapat_tagok/Tomi/DHCP.html">DHCP</a> (Csapattárs oldala)</li>
        </ul>

        <h2>A csapat tagjai:</h2>
        <ul>
            <li>> <a href="../csapat_tagok/gergo/gergo.html">Eppel Gergő (Én)</a></li>
            <li>> <a href="../csapat_tagok/matyi/K-T.M.html">Kőrösi-Timár Mátyás</a></li>
            <li>> <a href="../csapat_tagok/Tomi/Dao_T.html">Dao Tamás</a></li>
        </ul>

        <h2>Rendszergazda Profil</h2>
        <img src="rendszergazda.jpg" alt="Rendszergazda" class="sysadmin-img">
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('hu-HU');
            document.getElementById('js-clock').innerText = `SYSTEM_TIME: ${timeString}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
